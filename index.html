<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Skin Shop</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(255,0,60,.18),transparent 35%),
        #070707;
    color:#fff;
    min-height:100vh;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:rgba(7,7,7,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,0,60,.2);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:900;
}

.logo-icon{
    width:44px;
    height:44px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ff003c,#7d001d);
    box-shadow:0 0 25px rgba(255,0,60,.25);
}

.logo-icon svg{
    width:29px;
    height:29px;
}

/* =========================
   PROFILE TOP BUTTON
========================= */

.profile-button{
    width:46px;
    height:46px;
    border-radius:50%;
    border:2px solid #ff1748;
    background:#171717;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:0;
    box-shadow:0 0 18px rgba(255,0,60,.18);
    transition:.25s;
}

.profile-button:hover{
    transform:scale(1.06);
    box-shadow:0 0 25px rgba(255,0,60,.35);
}

.profile-button img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:50%;
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    padding:80px 20px 45px;
}

.badge{
    display:inline-block;
    padding:8px 15px;
    margin-bottom:20px;
    border-radius:30px;
    border:1px solid rgba(255,0,60,.35);
    background:rgba(255,0,60,.08);
    color:#ff5575;
    font-size:13px;
}

.hero h1{
    font-size:clamp(38px,7vw,72px);
    line-height:1.1;
    font-weight:1000;
    background:linear-gradient(90deg,#fff,#ff1748);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    max-width:650px;
    margin:20px auto 27px;
    color:#999;
    line-height:2;
}

.telegram-button{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:14px 24px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff003c,#980020);
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 12px 35px rgba(255,0,60,.18);
    transition:.25s;
}

.telegram-button:hover{
    transform:translateY(-3px);
}

/* =========================
   CONTENT
========================= */

.container{
    width:min(1200px,92%);
    margin:auto;
}

.search{
    margin:10px 0 30px;
}

.search input{
    width:100%;
    height:55px;
    padding:0 20px;
    border-radius:15px;
    outline:none;
    border:1px solid #292929;
    background:#111;
    color:#fff;
    font-size:15px;
    transition:.2s;
}

.search input:focus{
    border-color:#ff1748;
    box-shadow:0 0 20px rgba(255,0,60,.1);
}

/* =========================
   PRODUCTS
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
    padding-bottom:80px;
}

.card{
    overflow:hidden;
    border-radius:20px;
    background:linear-gradient(145deg,#151515,#0d0d0d);
    border:1px solid #252525;
    transition:.25s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#ff1748;
    box-shadow:0 18px 45px rgba(255,0,60,.12);
}

.card-image{
    height:180px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#252525,transparent 65%),
        #101010;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.card-info{
    padding:17px;
}

.card-info h3{
    font-size:15px;
    margin-bottom:8px;
}

.condition{
    color:#888;
    font-size:12px;
    margin-bottom:13px;
}

.price{
    color:#ff3158;
    font-size:20px;
    font-weight:900;
}

.buy-button{
    width:100%;
    margin-top:14px;
    padding:12px;
    border-radius:11px;
    border:1px solid #303030;
    background:#1c1c1c;
    color:#fff;
    font-weight:bold;
    transition:.2s;
}

.buy-button:hover{
    background:#ff003c;
    border-color:#ff003c;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(480px,100%);
    max-height:90vh;
    overflow:auto;
    padding:25px;
    border-radius:24px;
    background:#111;
    border:1px solid #292929;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
    animation:modalOpen .25s ease;
}

@keyframes modalOpen{
    from{
        opacity:0;
        transform:translateY(15px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:23px;
}

.modal-header h2{
    font-size:20px;
}

.close-button{
    width:36px;
    height:36px;
    border:0;
    border-radius:10px;
    background:#1d1d1d;
    color:#aaa;
    font-size:22px;
}

.close-button:hover{
    background:#ff003c;
    color:#fff;
}

/* =========================
   BUY MODAL
========================= */

.product-preview{
    padding:16px;
    border-radius:16px;
    background:#181818;
    border:1px solid #292929;
    margin-bottom:20px;
}

.product-preview h3{
    margin-bottom:7px;
}

.product-preview p{
    color:#ff3158;
    font-weight:bold;
}

.section-label{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

.wear-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

.wear-button{
    padding:13px 8px;
    border-radius:12px;
    border:1px solid #292929;
    background:#191919;
    color:#aaa;
    transition:.2s;
}

.wear-button:hover,
.wear-button.active{
    color:#fff;
    border-color:#ff1748;
    background:rgba(255,0,60,.12);
}

.confirm-buy{
    width:100%;
    padding:15px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#ff003c,#98001f);
    color:#fff;
    font-weight:900;
    font-size:15px;
}

/* =========================
   PROFILE
========================= */

.avatar-section{
    text-align:center;
    margin-bottom:23px;
}

.profile-avatar{
    width:96px;
    height:96px;
    display:block;
    margin:0 auto 12px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ff1748;
    background:#191919;
    box-shadow:0 0 25px rgba(255,0,60,.15);
}

.change-photo{
    display:inline-block;
    padding:9px 15px;
    border-radius:10px;
    background:#202020;
    color:#ddd;
    font-size:12px;
    cursor:pointer;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#aaa;
    font-size:12px;
}

.field input{
    width:100%;
    height:50px;
    padding:0 14px;
    border-radius:12px;
    border:1px solid #2b2b2b;
    background:#181818;
    color:#fff;
    outline:none;
    transition:.25s;
}

.field input:focus{
    border-color:#ff1748;
}

/* =========================
   PHONE ERROR
========================= */

.phone-error{
    display:none;
    margin-top:8px;
    color:#ff3158;
    font-size:12px;
    font-weight:bold;
}

.phone-error.show{
    display:block;
    animation:errorAppear .25s ease;
}

.phone-input.error{
    border-color:#ff1748 !important;
    box-shadow:0 0 0 2px rgba(255,23,72,.12);
    animation:phoneShake .45s ease;
}

@keyframes phoneShake{
    0%{
        transform:translateX(0);
    }

    15%{
        transform:translateX(8px);
    }

    30%{
        transform:translateX(-8px);
    }

    45%{
        transform:translateX(6px);
    }

    60%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(3px);
    }

    100%{
        transform:translateX(0);
    }
}

@keyframes errorAppear{
    from{
        opacity:0;
        transform:translateY(-5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   PROFILE BUTTONS
========================= */

.save-profile{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#ff003c;
    color:#fff;
    font-weight:bold;
}

.delete-profile{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    border:1px solid #302020;
    background:#191919;
    color:#ff526f;
}

.delete-profile:hover{
    background:#291217;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:5000;
    left:50%;
    bottom:25px;
    transform:translate(-50%,30px);
    padding:13px 20px;
    border-radius:13px;
    background:#191919;
    border:1px solid #333;
    color:#fff;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:0 18px;
    }

    .logo{
        font-size:15px;
    }

    .logo-icon{
        width:42px;
        height:42px;
    }

    .hero{
        padding-top:55px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card-image{
        height:125px;
    }

    .card-info{
        padding:12px;
    }

    .card-info h3{
        font-size:12px;
    }

    .price{
        font-size:16px;
    }

    .buy-button{
        font-size:12px;
        padding:10px;
    }

    .wear-list{
        grid-template-columns:1fr;
    }
}

@media(max-width:380px){

    .products{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<script>

/* ==================================================
   TELEGRAM
================================================== */

const TELEGRAM_USERNAME = "aghojavaad";


/* ==================================================
   STORAGE KEYS
================================================== */

const STORAGE_NAME = "cs2_profile_name";
const STORAGE_PHONE = "cs2_profile_phone";
const STORAGE_AVATAR = "cs2_profile_avatar";


/* ==================================================
   DEFAULT AVATAR
================================================== */

const DEFAULT_AVATAR_SVG = `
<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

    <defs>

        <linearGradient
            id="avatarGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#ff003c"/>

            <stop
                offset="100%"
                stop-color="#65001a"/>

        </linearGradient>

    </defs>

    <circle
        cx="100"
        cy="100"
        r="100"
        fill="#151515"/>

    <circle
        cx="100"
        cy="72"
        r="38"
        fill="url(#avatarGradient)"/>

    <path
        d="M35 190
           C42 145 68 122 100 122
           C132 122 158 145 165 190
           Z"
        fill="url(#avatarGradient)"/>

</svg>
`;


/*
    تبدیل SVG به Data URL
    تا آواتار پیش‌فرض کاملاً داخل خود سایت باشد
    و به اینترنت یا عکس خارجی وابسته نباشد.
*/

const DEFAULT_AVATAR =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(DEFAULT_AVATAR_SVG);


/* ==================================================
   PRODUCTS
================================================== */

const products = [

    {
        name:"M4A1 | Naval Shred",
        price:"120T",
        condition:"Factory New",

];


/* ==================================================
   VARIABLES
================================================== */

let filteredProducts = [...products];

/* ==================================================

================================================== */

const productsContainer =
    document.getElementById("productsContainer");

    document.getElementById("searchInput");

    document.getElementById("buyModal");

    document.getElementById("profileModal");

    document.getElementById("headerAvatar");

    document.getElementById("profileAvatar");

    document.getElementById("profileName");

    document.getElementById("profilePhone");

    document.getElementById("phoneError");

const toast =
    document.getElementById("toast");


/* ==================================================
   SAFE AVATAR
================================================== */

function setAvatar(element, src){

    /*
        همیشه اول آواتار را تعیین می‌کنیم.
        اگر src خراب باشد، آواتار پیش‌فرض می‌آید.
    */

    element.src = src || DEFAULT_AVATAR;

    element.onerror = function(){

        this.onerror = null;

        this.src = DEFAULT_AVATAR;

    };
}


/* ==================================================
   LOAD AVATAR
================================================== */

function loadAvatar(){

    const savedAvatar =
        localStorage.getItem(STORAGE_AVATAR);

    if(savedAvatar){

        setAvatar(
            headerAvatar,
            savedAvatar
        );

        setAvatar(
            profileAvatar,
            savedAvatar
        );

    }else{

        setAvatar(
            headerAvatar,
            DEFAULT_AVATAR
        );

        setAvatar(
            profileAvatar,
            DEFAULT_AVATAR
        );

    }
}


/* ==================================================
   RENDER PRODUCTS
================================================== */

function renderProducts(list){

    if(!list.length){

        productsContainer.innerHTML = `
            <div class="empty">
                😔 اسکینی با این اسم پیدا نشد
            </div>
        `;

        return;
    }


    productsContainer.innerHTML =
        list.map((product,index)=>`

            <div class="card">

                <div class="card-image">

                    <img
                        src="${product.image}"
                        alt="${product.name}">

                </div>

                <div class="card-info">

                    <h3>
                        ${product.name}
                    </h3>

                    <div class="condition">
                        ${product.condition}
                    </div>

                    <div class="price">
                        ${product.price}
                    </div>

                    <button
                        class="buy-button"
                        data-index="${index}">

                        🛒 خرید

                    </button>

                </div>

            </div>

        `).join("");


    /*
        رویداد خرید را بعد از ساخت کارت‌ها وصل می‌کنیم.
    */

    document
        .querySelectorAll(".buy-button")
        .forEach(button=>{

            button.addEventListener(
                "click",
                function(){

                    const index =
                        Number(this.dataset.index);

                    openBuy(index);

                }
            );

        });

}


/* ==================================================
   SEARCH

/* ==================================================
   OPEN PROFILE
================================================== */

function openProfile(){

    profileName.value =
        localStorage.getItem(STORAGE_NAME) || "";

    profilePhone.value =
        localStorage.getItem(STORAGE_PHONE) || "";

    clearPhoneError();


    const savedAvatar =
        localStorage.getItem(STORAGE_AVATAR);


    setAvatar(
        profileAvatar,
        savedAvatar || DEFAULT_AVATAR
    );


    profileModal.classList.add("show");
}


/* ==================================================
   PHONE NORMALIZE
================================================== */

function normalizePhone(value){

    return value
        .replace(/[۰-۹]/g,function(digit){

            return "۰۱۲۳۴۵۶۷۸۹"
                .indexOf(digit);

        })
        .replace(/[^\d+]/g,"");

}


/* ==================================================
   PHONE VALIDATION
================================================== */

function isValidPhone(value){

    const phone =
        normalizePhone(value);


    /*
        شماره ایرانی:

        09123456789

        یا

        +989123456789

        یا

        00989123456789
    */

    const pattern =
        /^(09\d{9}|\+989\d{9}|00989\d{9})$/;


    return pattern.test(phone);
}


/* ==================================================
   CLEAR PHONE ERROR
================================================== */

function clearPhoneError(){

    profilePhone.classList.remove("error");

    phoneError.classList.remove("show");

}


/* ==================================================
   SHOW PHONE ERROR
================================================== */

function showPhoneError(){

    /*
        کلاس را حذف می‌کنیم و دوباره اضافه می‌کنیم
        تا انیمیشن هر بار اجرا شود.
    */

    profilePhone.classList.remove("error");

    void profilePhone.offsetWidth;

    profilePhone.classList.add("error");

    phoneError.classList.remove("show");

    void phoneError.offsetWidth;

    phoneError.classList.add("show");

    profilePhone.focus();

}


/* ==================================================
   PHONE INPUT
================================================== */

profilePhone.addEventListener(
    "input",
    function(){

        /*
            اگر کاربر شروع کرد به اصلاح شماره،
            خطا فوراً پاک می‌شود.
        */

        clearPhoneError();

    }
);


/* ==================================================
   SAVE PROFILE
================================================== */

document
    .getElementById("saveProfileButton")
    .addEventListener(
        "click",
        function(){

            const name =
                profileName.value.trim();


            const phone =
                normalizePhone(
                    profilePhone.value.trim()
                );


            /*
                اگر شماره وارد شده باشد،
                باید درست باشد.
            */

            if(phone !== "" && !isValidPhone(phone)){

                showPhoneError();

                showToast(
                    "شماره موبایل اشتباه است ❌"
                );

                return;
            }


            /*
                ذخیره اطلاعات
            */

            localStorage.setItem(
                STORAGE_NAME,
                name
            );


            localStorage.setItem(
                STORAGE_PHONE,
                phone
            );


            showToast(
                "پروفایل با موفقیت ذخیره شد ✅"
            );


            setTimeout(
                function(){

                    closeModal("profileModal");

                },
                700
            );

        }
    );


/* ==================================================
   AVATAR UPLOAD
================================================== */

document
    .getElementById("avatarInput")
    .addEventListener(
        "change",
        function(){

            const file =
                this.files[0];


            if(!file){

                return;
            }


            if(!file.type.startsWith("image/")){

                showToast(
                    "فایل انتخاب‌شده عکس نیست ❌"
                );

                this.value = "";

                return;
            }


            /*
                حداکثر 5 مگابایت
            */

            if(file.size > 5 * 1024 * 1024){

                showToast(
                    "حجم عکس بیشتر از 5MB است ❌"
                );

                this.value = "";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const imageData =
                        event.target.result;


                    /*
                        ذخیره در مرورگر
                    */

                    localStorage.setItem(
                        STORAGE_AVATAR,
                        imageData
                    );


                    /*
                        نمایش همزمان
                    */

                    setAvatar(
                        profileAvatar,
                        imageData
                    );


                    setAvatar(
                        headerAvatar,
                        imageData
                    );


                    showToast(
                        "عکس پروفایل تغییر کرد ✅"
                    );

                };


            reader.onerror =
                function(){

                    showToast(
                        "لود عکس انجام نشد ❌"
                    );

                };


            reader.readAsDataURL(file);

        }
    );


/* ==================================================
   DELETE PROFILE
================================================== */

document
    .getElementById("deleteProfileButton")
    .addEventListener(
        "click",
        function(){

            const result =
                confirm(
                    "آیا مطمئنی می‌خواهی اطلاعات پروفایل حذف شود؟"
                );


            if(!result){

                return;
            }


            localStorage.removeItem(
                STORAGE_NAME
            );

            localStorage.removeItem(
                STORAGE_PHONE
            );

            localStorage.removeItem(
                STORAGE_AVATAR
            );


            profileName.value = "";

            profilePhone.value = "";

            clearPhoneError();


            setAvatar(
                profileAvatar,
                DEFAULT_AVATAR
            );

            setAvatar(
                headerAvatar,
                DEFAULT_AVATAR
            );


            showToast(
                "اطلاعات پروفایل حذف شد"
            );

        }
    );


/* ==================================================
   CLOSE MODAL
================================================== */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}


/* ==================================================
   CLICK OUTSIDE MODAL
================================================== */

document
    .querySelectorAll(".modal")
    .forEach(modal=>{

        modal.addEventListener(
            "click",
            function(event){

                if(event.target === modal){

                    modal.classList.remove("show");

                }

            }
        );

    });


/* ==================================================
   ESC KEY
================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            document
                .querySelectorAll(".modal.show")
                .forEach(modal =>
                    modal.classList.remove("show")
                );

        }

    }
);


/* ==================================================
   TOAST
================================================== */

let toastTimer = null;

function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove("show");

            },
            2500
        );

}


/* ==================================================
   START WEBSITE
================================================== */

loadAvatar();

renderProducts(products);

</script>
