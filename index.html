<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 SKIN SHOP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top right,#300000 0,#090909 35%,#050505 100%);
    color:white;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

header{
    height:76px;
    background:rgba(5,5,5,.94);
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(15px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#e60000;
}

.knife-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    filter:drop-shadow(0 0 10px #ff0000);
}

.knife-icon svg{
    width:45px;
    height:45px;
}

.profile-button{
    width:48px;
    height:48px;
    border-radius:50%;
    border:2px solid #e00000;
    background:#111;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 0 15px rgba(255,0,0,.25);
}

.profile-button img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.profile-default{
    font-size:21px;
}

.hero{
    text-align:center;
    padding:65px 20px 35px;
}

.hero h1{
    font-size:clamp(38px,8vw,76px);
    font-weight:1000;
    letter-spacing:4px;
    text-shadow:0 0 25px rgba(255,0,0,.35);
}

.hero h1 span{
    color:#ed0000;
}

.hero p{
    color:#aaa;
    margin-top:12px;
}

.telegram-top{
    display:inline-flex;
    margin-top:25px;
    padding:13px 25px;
    border-radius:12px;
    background:#e00000;
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

.telegram-top:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(255,0,0,.4);
}

.controls{
    max-width:1150px;
    margin:15px auto 30px;
    padding:0 18px;
}

.search{
    width:100%;
    background:#111;
    border:1px solid #303030;
    color:white;
    padding:16px 20px;
    border-radius:13px;
    outline:none;
    font-size:15px;
    transition:.2s;
}

.search:focus{
    border-color:#d00000;
    box-shadow:0 0 20px rgba(255,0,0,.12);
}

.products{
    width:min(1200px,94%);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
    padding-bottom:70px;
}

.card{
    background:
        linear-gradient(145deg,#151515,#090909);
    border:1px solid #282828;
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    position:relative;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#d00000;
    box-shadow:0 15px 40px rgba(0,0,0,.5),0 0 25px rgba(220,0,0,.12);
}

.gun-image{
    width:100%;
    height:225px;
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#242424 0,#111 55%,#080808 100%);
    border-bottom:1px solid #222;
}

.gun-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
    filter:drop-shadow(0 12px 12px rgba(0,0,0,.8));
}

.card-info{
    padding:17px;
}

.card-info h3{
    font-size:16px;
    margin-bottom:9px;
    direction:ltr;
    text-align:left;
}

.condition{
    color:#aaa;
    font-size:13px;
    margin-bottom:14px;
}

.buy{
    width:100%;
    border:0;
    padding:12px;
    border-radius:10px;
    background:linear-gradient(135deg,#ef0000,#9d0000);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.buy:hover{
    filter:brightness(1.15);
    transform:scale(1.02);
}

/* هیچ قیمتی زیر کارت نمایش داده نمی‌شود */

.empty{
    grid-column:1/-1;
    text-align:center;
    color:#888;
    padding:50px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(470px,100%);
    background:#101010;
    border:1px solid #333;
    border-radius:20px;
    padding:25px;
    box-shadow:0 25px 80px rgba(0,0,0,.8);
    position:relative;
}

.close{
    position:absolute;
    left:17px;
    top:14px;
    background:none;
    border:0;
    color:#aaa;
    font-size:27px;
    cursor:pointer;
}

.modal-title{
    font-size:21px;
    font-weight:900;
    margin-bottom:8px;
}

.modal-sub{
    color:#999;
    font-size:13px;
    margin-bottom:22px;
}

.modal-input,
.select{
    width:100%;
    padding:14px;
    background:#080808;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    margin-bottom:12px;
}

.modal-input:focus,
.select:focus{
    border-color:#d00000;
}

.telegram-order{
    width:100%;
    border:0;
    background:#e00000;
    color:#fff;
    padding:14px;
    border-radius:11px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

/* PROFILE */

.profile-avatar-wrap{
    display:flex;
    justify-content:center;
    margin:10px 0 22px;
}

.profile-avatar{
    width:105px;
    height:105px;
    border-radius:50%;
    border:3px solid #e00000;
    object-fit:cover;
    background:#1a1a1a;
}

.avatar-button{
    display:block;
    margin:0 auto 20px;
    background:#222;
    color:white;
    border:1px solid #444;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
}

.profile-label{
    color:#aaa;
    display:block;
    margin-bottom:7px;
    font-size:13px;
}

.save-profile{
    width:100%;
    padding:13px;
    background:#e00000;
    color:white;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.delete-profile{
    width:100%;
    padding:11px;
    margin-top:10px;
    background:#191919;
    color:#ff4444;
    border:1px solid #333;
    border-radius:10px;
    cursor:pointer;
}

.error{
    animation:shake .3s;
    border-color:#f00!important;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
}

@media(max-width:600px){
    header{
        padding:0 14px;
    }

    .logo{
        font-size:17px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .gun-image{
        height:155px;
        padding:12px;
    }

    .card-info{
        padding:12px;
    }

    .card-info h3{
        font-size:12px;
    }

    .condition{
        font-size:11px;
    }

    .buy{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <div class="knife-icon">
            <svg viewBox="0 0 100 100" fill="none">
                <path d="M17 65L48 33L58 43L29 72L17 65Z"
                      fill="#e00000"/>
                <path d="M49 32L76 12L84 20L59 43L49 32Z"
                      fill="#eeeeee"/>
                <path d="M29 72L42 80L58 63L49 54L29 72Z"
                      fill="#777"/>
                <circle cx="50" cy="48" r="5" fill="#111"/>
                <path d="M56 44L69 31" stroke="#e00000" stroke-width="4"/>
            </svg>
        </div>

        <div>
            CS2 <span>SKIN SHOP</span>
        </div>
    </div>

    <button class="profile-button" onclick="openProfile()">
        <span class="profile-default" id="profileDefault">👤</span>
        <img id="headerAvatar" alt="Profile">
    </button>

</header>


<section class="hero">

    <h1>CS2 <span>SKIN SHOP</span></h1>

    <p>
        بهترین اسکین‌های CS2 با خرید سریع
    </p>

    <a
        class="telegram-top"
        href="https://t.me/aghojavaad"
        target="_blank"
    >
        💬 Telegram
    </a>

</section>


<div class="controls">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 جستجوی گان..."
        oninput="searchProducts()"
    >

</div>


<main class="products" id="products"></main>


<!-- BUY MODAL -->

<div class="modal" id="buyModal">

    <div class="modal-box">

        <button class="close" onclick="closeBuy()">×</button>

        <div class="modal-title" id="buyTitle">
            خرید اسکین
        </div>

        <div class="modal-sub" id="buySub"></div>

        <select class="select" id="wearSelect">

            <option value="Factory New">
                Factory New
            </option>

            <option value="Minimal Wear">
                Minimal Wear
            </option>

            <option value="Field-Tested">
                Field-Tested
            </option>

            <option value="Well-Worn">
                Well-Worn
            </option>

            <option value="Battle-Scarred">
                Battle-Scarred
            </option>

        </select>

        <button
            class="telegram-order"
            onclick="sendTelegramOrder()"
        >
            💬 ادامه خرید در تلگرام
        </button>

    </div>

</div>


<!-- PROFILE MODAL -->

<div class="modal" id="profileModal">

    <div class="modal-box">

        <button class="close" onclick="closeProfile()">×</button>

        <div class="modal-title">
            پروفایل
        </div>

        <div class="profile-avatar-wrap">

            <img
                class="profile-avatar"
                id="profileAvatar"
                alt="Avatar"
            >

        </div>

        <input
            id="avatarInput"
            type="file"
            accept="image/*"
            hidden
        >

        <button
            class="avatar-button"
            onclick="document.getElementById('avatarInput').click()"
        >
            📷 تغییر عکس پروفایل
        </button>


        <label class="profile-label">
            نام
        </label>

        <input
            class="modal-input"
            id="profileName"
            type="text"
            placeholder="نام شما"
        >


        <label class="profile-label">
            شماره موبایل
        </label>

        <input
            class="modal-input"
            id="profilePhone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="15"
            placeholder="09123456789"
        >


        <button
            class="save-profile"
            onclick="saveProfile()"
        >
            ذخیره اطلاعات
        </button>

        <button
            class="delete-profile"
            onclick="deleteProfile()"
        >
            حذف اطلاعات پروفایل
        </button>

    </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const TELEGRAM_USERNAME = "aghojavaad";


/* =========================
   PRODUCTS
========================= */

const products = [

    {
        name:"M4A1-S | Boreal Forest",
        condition:"Minimal Wear",
        price:"110T",

        /* تصویر واقعی اسکین */
        image:"https://www.csgostash.com/img/skins/large/M4A1-S_Boreal_Forest.png"
    },

    {
        name:"R8 Revolver | Junk Yard",
        condition:"Field-Tested",
        price:"60T",

        image:"https://www.csgostash.com/img/skins/large/R8_Revolver_Junk_Yard.png"
    },

    {
        name:"StatTrak™ USP-S | Black Lotus",
        condition:"Field-Tested",
        price:"135T",

        image:"https://www.csgostash.com/img/skins/large/USP-S_Black_Lotus.png"
    },

    {
        name:"M4A4 | Naval Shred Camo",
        condition:"Factory New",
        price:"120T",

        image:"https://www.csgostash.com/img/skins/large/M4A4_Naval_Shred_Camo.png"
    },

    {
        name:"Desert Eagle | Blue Ply",
        condition:"Factory New",
        price:"160T",

        image:"https://www.csgostash.com/img/skins/large/Desert_Eagle_Blue_Ply.png"
    }

];


/* =========================
   RENDER PRODUCTS
========================= */

const productsContainer =
    document.getElementById("products");

function renderProducts(list){

    productsContainer.innerHTML = "";

    if(list.length === 0){

        productsContainer.innerHTML = `
            <div class="empty">
                گانی با این اسم پیدا نشد.
            </div>
        `;

        return;
    }

    list.forEach((product,index)=>{

        const card = document.createElement("article");

        card.className = "card";

        card.innerHTML = `

            <div class="gun-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                    onerror="this.style.opacity='.25';"
                >

            </div>

            <div class="card-info">

                <h3>
                    ${product.name}
                </h3>

                <div class="condition">
                    ${product.condition}
                </div>

                <button
                    class="buy"
                    onclick="openBuy(${index})"
                >
                    خرید
                </button>

            </div>
        `;

        productsContainer.appendChild(card);

    });
}


/* =========================
   SEARCH
========================= */

function searchProducts(){

    const value =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filtered =
        products.filter(product =>
            product.name
            .toLowerCase()
            .includes(value)
        );

    renderProducts(filtered);
}


/* =========================
   BUY
========================= */

let selectedProduct = null;

function openBuy(index){

    selectedProduct = products[index];

    document.getElementById("buyTitle").textContent =
        selectedProduct.name;

    document.getElementById("buySub").textContent =
        "Condition: " + selectedProduct.condition +
        " | Price: " + selectedProduct.price;

    document.getElementById("wearSelect").value =
        selectedProduct.condition;

    document
        .getElementById("buyModal")
        .classList.add("show");
}


function closeBuy(){

    document
        .getElementById("buyModal")
        .classList.remove("show");

}


function sendTelegramOrder(){

    if(!selectedProduct) return;

    const wear =
        document.getElementById("wearSelect").value;

    const name =
        localStorage.getItem("cs2_profile_name") || "";

    const phone =
        localStorage.getItem("cs2_profile_phone") || "";

    const message =
`سلام، برای خرید این اسکین پیام دادم 🎮

🎯 Skin:
${selectedProduct.name}

🔧 Condition:
${wear}

💰 Price:
${selectedProduct.price}

👤 Name:
${name || "ثبت نشده"}

📱 Phone:
${phone || "ثبت نشده"}`;

    const url =
        "https://t.me/" +
        TELEGRAM_USERNAME +
        "?text=" +
        encodeURIComponent(message);

    window.open(url,"_blank");

}


/* =========================
   PROFILE
========================= */

function openProfile(){

    document
        .getElementById("profileModal")
        .classList.add("show");

    loadProfile();

}


function closeProfile(){

    document
        .getElementById("profileModal")
        .classList.remove("show");

}


/* =========================
   PHONE NORMALIZE
========================= */

function normalizePhone(value){

    return value
        .replace(/[۰-۹]/g, d =>
            String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        )
        .replace(/\D/g,"");

}


function validIranPhone(value){

    const phone = normalizePhone(value);

    return /^09\d{9}$/.test(phone);
}


/* =========================
   PROFILE SAVE
========================= */

function saveProfile(){

    const name =
        document
        .getElementById("profileName")
        .value
        .trim();

    const phoneInput =
        document.getElementById("profilePhone");

    const phone =
        normalizePhone(phoneInput.value);

    if(phone && !validIranPhone(phone)){

        phoneInput.classList.remove("error");

        void phoneInput.offsetWidth;

        phoneInput.classList.add("error");

        alert("❌ شماره موبایل اشتباه است");

        return;
    }

    localStorage.setItem(
        "cs2_profile_name",
        name
    );

    localStorage.setItem(
        "cs2_profile_phone",
        phone
    );

    updateHeaderAvatar();

    alert("اطلاعات با موفقیت ذخیره شد.");

    closeProfile();

}


/* =========================
   AVATAR
========================= */

document
.getElementById("avatarInput")
.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const image = new Image();

        image.onload = function(){

            const canvas =
                document.createElement("canvas");

            const size = 500;

            canvas.width = size;
            canvas.height = size;

            const ctx =
                canvas.getContext("2d");

            const min =
                Math.min(
                    image.width,
                    image.height
                );

            const sx =
                (image.width - min) / 2;

            const sy =
                (image.height - min) / 2;

            ctx.drawImage(
                image,
                sx,
                sy,
                min,
                min,
                0,
                0,
                size,
                size
            );

            const compressed =
                canvas.toDataURL(
                    "image/jpeg",
                    .82
                );

            localStorage.setItem(
                "cs2_profile_avatar",
                compressed
            );

            document
                .getElementById("profileAvatar")
                .src = compressed;

            updateHeaderAvatar();

        };

        image.src = e.target.result;

    };

    reader.readAsDataURL(file);

});


/* =========================
   LOAD PROFILE
========================= */

function loadProfile(){

    const name =
        localStorage.getItem(
            "cs2_profile_name"
        ) || "";

    const phone =
        localStorage.getItem(
            "cs2_profile_phone"
        ) || "";

    const avatar =
        localStorage.getItem(
            "cs2_profile_avatar"
        ) || "";

    document
        .getElementById("profileName")
        .value = name;

    document
        .getElementById("profilePhone")
        .value = phone;

    const avatarElement =
        document.getElementById("profileAvatar");

    if(avatar){

        avatarElement.src = avatar;

    }else{

        avatarElement.removeAttribute("src");

    }

}


/* =========================
   HEADER AVATAR
========================= */

function updateHeaderAvatar(){

    const avatar =
        localStorage.getItem(
            "cs2_profile_avatar"
        );

    const img =
        document.getElementById("headerAvatar");

    const defaultIcon =
        document.getElementById("profileDefault");

    if(avatar){

        img.src = avatar;
        img.style.display = "block";
        defaultIcon.style.display = "none";

    }else{

        img.style.display = "none";
        defaultIcon.style.display = "block";

    }

}


/* =========================
   DELETE PROFILE
========================= */

function deleteProfile(){

    localStorage.removeItem(
        "cs2_profile_name"
    );

    localStorage.removeItem(
        "cs2_profile_phone"
    );

    localStorage.removeItem(
        "cs2_profile_avatar"
    );

    document
        .getElementById("profileName")
        .value = "";

    document
        .getElementById("profilePhone")
        .value = "";

    document
        .getElementById("profileAvatar")
