<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSGOSHOP | CS2 SKINS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --red:#ff173f;
    --red2:#b9002d;
    --dark:#050505;
    --card:#101010;
    --line:#292929;
    --text:#fff;
    --muted:#888;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Vazirmatn,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(255,0,40,.22),transparent 35%),
        radial-gradient(circle at 90% 40%,rgba(255,0,40,.08),transparent 30%),
        #050505;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-5;
    opacity:.07;
    background:
        linear-gradient(90deg,rgba(255,0,50,.4) 1px,transparent 1px),
        linear-gradient(rgba(255,0,50,.4) 1px,transparent 1px);
    background-size:60px 60px;
}

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ff1744;
    box-shadow:0 0 12px #ff1744;
    animation:particle 6s infinite ease-in-out;
}

@keyframes particle{
    0%,100%{
        transform:translateY(0);
        opacity:.1;
    }
    50%{
        transform:translateY(-90px);
        opacity:1;
    }
}

/* ================= HEADER ================= */

header{
    height:76px;
    position:sticky;
    top:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4%;
    background:rgba(5,5,5,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,23,68,.3);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    direction:ltr;
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:white;
}

.logo .red{
    color:var(--red);
    text-shadow:0 0 25px rgba(255,23,68,.7);
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--red);
    font-size:19px;
    box-shadow:0 0 18px rgba(255,0,50,.25);
}

.nav{
    display:flex;
    gap:35px;
}

.nav button{
    border:0;
    background:none;
    color:#aaa;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
    transition:.3s;
}

.nav button:hover{
    color:var(--red);
}

/* ================= PROFILE HEADER ================= */

.profile-mini{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 10px;
    background:#101010;
    border:1px solid #292929;
    border-radius:13px;
    cursor:pointer;
    transition:.3s;
}

.profile-mini:hover{
    border-color:var(--red);
    box-shadow:0 0 25px rgba(255,0,50,.15);
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff1744,#4b0013);
    border:2px solid #ff1744;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.mini-info small{
    color:#666;
    display:block;
    font-size:9px;
}

.mini-info strong{
    display:block;
    font-size:12px;
}

.mini-info span{
    display:block;
    direction:ltr;
    color:#777;
    font-size:9px;
    text-align:right;
}

/* ================= HERO ================= */

.hero{
    width:92%;
    max-width:1450px;
    height:420px;
    margin:30px auto;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,23,68,.5);
    border-radius:24px;

    background:
        linear-gradient(
            90deg,
            #060606 0%,
            rgba(6,6,6,.85) 32%,
            rgba(6,6,6,.25) 70%,
            #050505 100%
        ),
        radial-gradient(
            circle at 70% 50%,
            rgba(255,0,50,.5),
            transparent 35%
        );
}

.hero:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            transparent 49%,
            rgba(255,0,40,.08) 50%,
            transparent 51%
        );
    background-size:100% 8px;
    pointer-events:none;
}

/* terrorist graphic */

.terrorist{
    position:absolute;
    left:4%;
    bottom:-40px;
    width:530px;
    height:450px;
    animation:terroristFloat 4s ease-in-out infinite;
}

@keyframes terroristFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

.head{
    position:absolute;
    left:220px;
    top:45px;
    width:125px;
    height:145px;
    border-radius:48% 48% 42% 42%;
    background:
        repeating-linear-gradient(
            0deg,
            #262626 0 7px,
            #101010 8px 13px
        );
    border:3px solid #171717;
    box-shadow:
        0 0 30px rgba(255,0,40,.25),
        inset 0 0 25px #000;
    transform:rotate(-5deg);
}

.glasses{
    position:absolute;
    top:54px;
    left:16px;
    width:92px;
    height:37px;
    display:flex;
    gap:5px;
}

.glass{
    width:43px;
    height:28px;
    background:#050505;
    border:3px solid #555;
    border-radius:7px;
    box-shadow:0 0 10px #000;
}

.face-mask{
    position:absolute;
    bottom:0;
    left:10px;
    width:105px;
    height:80px;
    background:
        repeating-linear-gradient(
            0deg,
            #292929 0 8px,
            #111 9px 14px
        );
    border-radius:25px 25px 45px 45px;
}

.body{
    position:absolute;
    left:130px;
    top:165px;
    width:300px;
    height:260px;
    background:
        linear-gradient(90deg,#171717,#303030,#101010);
    clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);
    border:2px solid #181818;
}

.vest{
    position:absolute;
    left:205px;
    top:195px;
    width:150px;
    height:190px;
    border:3px solid #252525;
    background:
        repeating-linear-gradient(
            90deg,
            #111 0 30px,
            #292929 31px 35px
        );
}

.arm{
    position:absolute;
    width:85px;
    height:230px;
    background:#202020;
    border-radius:40px;
}

.arm.one{
    left:105px;
    top:190px;
    transform:rotate(38deg);
}

.arm.two{
    left:385px;
    top:190px;
    transform:rotate(-32deg);
}

.rifle{
    position:absolute;
    left:155px;
    top:245px;
    width:360px;
    height:32px;
    background:#111;
    border:4px solid #292929;
    transform:rotate(-13deg);
    box-shadow:
        0 0 20px rgba(255,0,40,.2);
}

.rifle:before{
    content:"";
    position:absolute;
    left:-65px;
    top:5px;
    width:75px;
    height:15px;
    background:#0b0b0b;
}

.rifle:after{
    content:"";
    position:absolute;
    right:70px;
    top:25px;
    width:70px;
    height:90px;
    background:#151515;
    transform:skew(-15deg);
}

.muzzle{
    position:absolute;
    right:-17px;
    top:8px;
    width:25px;
    height:17px;
    background:#050505;
}

/* hero text */

.hero-content{
    position:absolute;
    z-index:5;
    right:7%;
    top:75px;
    max-width:650px;
}

.badge{
    display:inline-block;
    padding:7px 15px;
    border:1px solid var(--red);
    color:var(--red);
    border-radius:30px;
    background:rgba(255,0,50,.06);
    font-size:10px;
}

.hero h1{
    margin-top:22px;
    font-size:58px;
    line-height:1.05;
    font-weight:900;
}

.hero h1 span{
    color:var(--red);
    text-shadow:0 0 35px rgba(255,0,50,.5);
}

.hero p{
    margin-top:18px;
    color:#aaa;
    font-size:13px;
    line-height:2;
}

.hero-button{
    margin-top:20px;
    padding:13px 25px;
    color:white;
    background:linear-gradient(135deg,var(--red),var(--red2));
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-weight:800;
    transition:.3s;
}

.hero-button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(255,0,50,.3);
}

/* ================= SHOP ================= */

.shop{
    width:92%;
    max-width:1450px;
    margin:40px auto 100px;
}

.shop-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.shop-title{
    font-size:28px;
    font-weight:900;
}

.shop-title span{
    color:var(--red);
}

.search{
    width:300px;
    padding:13px 17px;
    border-radius:11px;
    border:1px solid #292929;
    background:#101010;
    color:white;
    outline:none;
    font-family:inherit;
}

.search:focus{
    border-color:var(--red);
}

/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    gap:10px;
    margin-bottom:25px;
    overflow-x:auto;
    padding-bottom:5px;
}

.category{
    flex:0 0 auto;
    padding:12px 20px;
    color:#999;
    background:#101010;
    border:1px solid #292929;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    transition:.3s;
}

.category:hover,
.category.active{
    color:white;
    background:linear-gradient(135deg,var(--red),#9c0026);
    border-color:var(--red);
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    position:relative;
    padding:10px;
    border:1px solid #292929;
    border-radius:16px;
    background:
        linear-gradient(145deg,#151515,#080808);
    overflow:hidden;
    cursor:pointer;
    transition:.4s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:var(--red);
    box-shadow:
        0 20px 50px rgba(0,0,0,.6),
        0 0 25px rgba(255,0,50,.13);
}

.weapon-box{
    height:190px;
    border-radius:12px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(
            circle at center,
            rgba(255,0,50,.25),
            transparent 65%
        ),
        #080808;
}

.weapon-box:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            135deg,
            transparent 40%,
            rgba(255,0,50,.08),
            transparent 60%
        );
    pointer-events:none;
}

.weapon-svg{
    width:100%;
    height:100%;
    transition:.5s;
    filter:drop-shadow(0 20px 12px #000);
}

.card:hover .weapon-svg{
    transform:scale(1.08) rotate(-2deg);
}

.card-name{
    direction:ltr;
    text-align:right;
    margin:14px 4px 4px;
    font-weight:800;
    font-size:14px;
}

.card-model{
    color:var(--red);
    font-size:10px;
    margin:0 4px;
}

.details{
    width:100%;
    margin-top:12px;
    padding:10px;
    border-radius:9px;
    border:1px solid #3a3a3a;
    background:#131313;
    color:white;
    cursor:pointer;
    font-family:inherit;
    transition:.3s;
}

.card:hover .details{
    background:var(--red);
    border-color:var(--red);
}

/* ================= PRODUCT DETAIL ================= */

#productPage{
    display:none;
}

#productPage.show{
    display:block;
    animation:fadeIn .35s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.product-detail{
    width:92%;
    max-width:1400px;
    margin:35px auto 100px;
}

.back{
    border:1px solid #292929;
    background:#111;
    color:#aaa;
    padding:10px 17px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
}

.back:hover{
    color:white;
    border-color:var(--red);
}

.detail-grid{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:25px;
    margin-top:25px;
}

.detail-image{
    min-height:520px;
    border:1px solid #292929;
    border-radius:20px;
    background:
        radial-gradient(
            circle,
            rgba(255,0,50,.22),
            transparent 65%
        ),
        #080808;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.detail-image svg{
    width:94%;
    height:94%;
    filter:drop-shadow(0 25px 20px #000);
}

.detail-box{
    padding:30px;
    border:1px solid #292929;
    border-radius:20px;
    background:linear-gradient(145deg,#151515,#090909);
}

.detail-box h2{
    direction:ltr;
    text-align:right;
    font-size:30px;
}

.detail-type{
    color:var(--red);
    margin-top:7px;
    font-size:12px;
}

.detail-description{
    margin-top:20px;
    color:#777;
    line-height:2;
    font-size:12px;
}

.condition-title{
    margin-top:25px;
    margin-bottom:12px;
    color:#aaa;
}

.conditions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.condition{
    padding:14px;
    border-radius:10px;
    border:1px solid #292929;
    background:#111;
    cursor:pointer;
    transition:.3s;
}

.condition:hover{
    border-color:var(--red);
}

.condition.selected{
    border-color:var(--red);
    background:rgba(255,0,50,.1);
    box-shadow:0 0 20px rgba(255,0,50,.1);
}

.condition-name{
    display:block;
    font-size:11px;
}

.condition-price{
    display:block;
    color:var(--red);
    font-size:16px;
    font-weight:900;
    margin-top:4px;
}

.current-selection{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    border:1px solid #292929;
    background:#0e0e0e;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    font-size:11px;
    color:#777;
}

.row strong{
    color:white;
}

.buy{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:11px;
    color:white;
    background:linear-gradient(135deg,var(--red),var(--red2));
    font-family:inherit;
    font-weight:900;
    cursor:pointer;
    transition:.3s;
}

.buy:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(255,0,50,.3);
}

.buy.locked{
    background:#252525;
    color:#777;
    cursor:not-allowed;
    box-shadow:none;
}

/* ================= PROFILE MODAL ================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(10px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-overlay.open{
    display:flex;
}

.profile-modal{
    width:100%;
    max-width:430px;
    padding:28px;
    position:relative;
    background:#0d0d0d;
    border:1px solid var(--red);
    border-radius:20px;
    box-shadow:
        0 30px 100px #000,
        0 0 45px rgba(255,0,50,.15);
    animation:modalOpen .3s ease;
}

@keyframes modalOpen{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.close{
    position:absolute;
    left:15px;
    top:15px;
    width:33px;
    height:33px;
    border:0;
    border-radius:50%;
    background:#191919;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.profile-modal h2{
    text-align:center;
    margin-top:10px;
}

.modal-sub{
    text-align:center;
    color:#666;
    font-size:10px;
    margin-top:7px;
}

.photo-area{
    text-align:center;
    margin-top:15px;
}

.photo-circle{
    width:95px;
    height:95px;
    margin:auto;
    border-radius:50%;
    border:2px solid var(--red);
    background:linear-gradient(135deg,#ff1744,#47000f);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
    font-size:30px;
}

.photo-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#photoInput{
    display:none;
}

.input{
    width:100%;
    margin-top:13px;
    padding:13px;
    border:1px solid #292929;
    border-radius:10px;
    background:#111;
    color:white;
    outline:none;
    font-family:inherit;
}

.input:focus{
    border-color:var(--red);
}

.save-profile{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,var(--red),var(--red2));
    color:white;
    font-family:inherit;
    font-weight:900;
    cursor:pointer;
}

.profile-status{
    margin-top:13px;
    padding:10px;
    border-radius:9px;
    background:#151515;
    color:#777;
    font-size:10px;
    text-align:center;
}

.profile-status.ok{
    color:#31e89a;
}

/* ================= TELEGRAM ================= */

.telegram{
    position:fixed;
    z-index:4000;
    right:20px;
    bottom:20px;
    padding:12px 18px;
    border-radius:14px;
    color:white;
    text-decoration:none;
    background:linear-gradient(135deg,#ff1744,#a60029);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 10px 35px rgba(0,0,0,.5);
    animation:telegramPulse 2.5s infinite;
    font-size:11px;
}

@keyframes telegramPulse{
    50%{
        box-shadow:
            0 10px 40px rgba(255,0,50,.4);
    }
}

/* ================= FOOTER ================= */

footer{
    padding:35px;
    border-top:1px solid #222;
    text-align:center;
    color:#555;
    font-size:10px;
}

footer span{
    color:var(--red);
}

/* ================= MOBILE ================= */

@media(max-width:1050px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .nav{
        display:none;
    }

    .terrorist{
        opacity:.3;
        left:-100px;
    }
}

@media(max-width:650px){

    header{
        padding:0 3%;
    }

    .logo{
        font-size:18px;
    }

    .mini-info{
        display:none;
    }

    .hero{
        height:430px;
    }

    .hero-content{
        right:25px;
        top:55px;
    }

    .hero h1{
        font-size:40px;
    }

    .hero p{
        max-width:280px;
    }

    .terrorist{
        transform:scale(.7);
        transform-origin:bottom left;
        left:-80px;
    }

    .shop-top{
        flex-direction:column;
        align-items:stretch;
        gap:15px;
    }

    .search{
        width:100%;
    }

    .products{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .weapon-box{
        height:135px;
    }

    .card{
        padding:7px;
    }

    .card-name{
        font-size:11px;
    }

    .detail-image{
        min-height:300px;
    }

    .detail-box{
        padding:18px;
    }

    .conditions{
        grid-template-columns:1fr;
    }

    .telegram{
        right:12px;
        bottom:12px;
        padding:10px 13px;
    }
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        <div class="logo-icon">☠</div>
        <span>CSGO<span class="red">SHOP</span></span>
    </div>

    <nav class="nav">
        <button onclick="goHome()">خانه</button>
        <button onclick="scrollShop()">فروشگاه</button>
        <button onclick="openProfile()">پروفایل</button>
    </nav>

    <div class="profile-mini" onclick="openProfile()">

        <div class="avatar" id="headerAvatar">A</div>

        <div class="mini-info">
            <small>کاربر</small>
            <strong id="headerName">ورود / ثبت‌نام</strong>
            <span id="headerPhone">شماره وارد نشده</span>
        </div>

    </div>

</header>


<!-- ================= HOME ================= -->

<main id="homePage">

    <section class="hero">

        <!-- terrorist -->
        <div class="terrorist">

            <div class="head">
