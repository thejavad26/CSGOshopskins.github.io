<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080c">
<title>CS2 SKIN SHOP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#07080c;
    color:#fff;
    min-height:100vh;
}

/* ===== HEADER ===== */

.header{
    height:72px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(7,8,12,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #20222b;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:900;
    font-size:19px;
}

.logoIcon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:linear-gradient(135deg,#ff3030,#760808);
    box-shadow:0 0 30px rgba(255,30,30,.25);
}

.logo span{
    color:#ff3434;
}

.profileBtn{
    border:1px solid #292c35;
    background:#11131a;
    color:#fff;
    border-radius:30px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 12px 5px 6px;
    cursor:pointer;
}

.profileBtn img{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

/* ===== HERO ===== */

.hero{
    text-align:center;
    padding:75px 20px 45px;
}

.hero h1{
    font-size:clamp(32px,6vw,60px);
    font-weight:900;
    margin-bottom:16px;
}

.hero h1 span{
    color:#ff3030;
}

.hero p{
    color:#8e929d;
    line-height:2;
    font-size:14px;
}

.telegram{
    display:inline-block;
    margin-top:24px;
    padding:13px 23px;
    border-radius:12px;
    color:white;
    text-decoration:none;
    font-weight:bold;
    background:linear-gradient(135deg,#ff3333,#870b0b);
}

/* ===== SEARCH ===== */

.searchArea{
    max-width:1200px;
    margin:auto;
    padding:0 20px 35px;
}

.search{
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    border:1px solid #292c35;
    background:#101218;
    color:#fff;
    outline:none;
    font-size:14px;
}

.search:focus{
    border-color:#e52c2c;
}

/* ===== PRODUCTS ===== */

.shop{
    max-width:1200px;
    margin:auto;
    padding:0 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
    gap:20px;
}

.card{
    background:linear-gradient(145deg,#15171e,#0c0e13);
    border:1px solid #20232b;
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#7f2222;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.imageBox{
    height:210px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#292c35 0%,#0c0e13 65%);
}

.imageBox img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.info{
    padding:18px;
}

.info h3{
    font-size:15px;
    margin-bottom:10px;
}

.info p{
    color:#777c87;
    font-size:11px;
    line-height:2;
    margin-bottom:14px;
}

.info strong{
    color:#ff3d3d;
}

.buyBtn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:11px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#ff3434,#9a0d0d);
}

/* ===== MODAL ===== */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.84);
    backdrop-filter:blur(12px);
}

.modal.show{
    display:flex;
}

.modalBox{
    width:100%;
    max-width:540px;
    max-height:92vh;
    overflow-y:auto;
    background:
        radial-gradient(circle at 100% 0%,rgba(255,30,30,.12),transparent 35%),
        #0e1015;
    border:1px solid #292c35;
    border-radius:24px;
    padding:22px;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.modalTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modalTop h2{
    font-size:19px;
}

.closeBtn{
    width:36px;
    height:36px;
    border:1px solid #292c35;
    border-radius:50%;
    background:#171920;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* ===== PRODUCT PREVIEW ===== */

.preview{
    display:flex;
    align-items:center;
    gap:15px;
    padding:13px;
    border-radius:15px;
    background:#090b0f;
    border:1px solid #22252e;
    margin-bottom:22px;
}

.preview img{
    width:105px;
    height:65px;
    object-fit:contain;
}

.preview small{
    display:block;
    color:#666b76;
    margin-top:7px;
}

/* ===== MODERN WEAR SELECTOR ===== */

.selectorTitle{
    font-size:12px;
    color:#aeb2bc;
    margin-bottom:13px;
    display:flex;
    align-items:center;
    gap:7px;
}

.selectorTitle b{
    color:#ff3636;
}

/* اینجا دیگه select معمولی وجود نداره */

.wearGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.wearCard{
    position:relative;
    min-height:86px;
    padding:15px;
    text-align:right;
    border:1px solid #282b34;
    border-radius:16px;
    background:
        linear-gradient(145deg,#181a21,#0b0d11);
    color:#fff;
    cursor:pointer;
    overflow:hidden;
    transition:.2s ease;
}

.wearCard:before{
    content:"";
    position:absolute;
    right:0;
    top:0;
    width:4px;
    height:100%;
    background:#363942;
    transition:.2s;
}

.wearCard:hover{
    transform:translateY(-3px);
    border-color:#663030;
}

.wearCard.active{
    border-color:#ff3434;
    background:
        radial-gradient(circle at 100% 0%,rgba(255,40,40,.25),transparent 55%),
        linear-gradient(145deg,#241417,#0c0e12);
    box-shadow:
        0 0 0 1px rgba(255,40,40,.15),
        0 10px 30px rgba(255,20,20,.12);
}

.wearCard.active:before{
    background:#ff3030;
    box-shadow:0 0 15px #ff3030;
}

.wearCheck{
    position:absolute;
    left:10px;
    top:10px;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#242730;
    color:transparent;
    font-size:11px;
    font-weight:bold;
}

.wearCard.active .wearCheck{
    background:#ff3030;
    color:white;
}

.wearName{
    display:block;
    font-size:12px;
    font-weight:900;
    margin-bottom:8px;
}

.wearCode{
    display:block;
    font-size:10px;
    color:#696e79;
}

.wearCard.active .wearName{
    color:#ff4a4a;
}

.wearCard.active .wearCode{
    color:#aa7373;
}

/* ===== SELECTED INFO ===== */

.selectedInfo{
    margin-top:14px;
    padding:12px 14px;
    border-radius:12px;
    background:#090b0f;
    border:1px solid #20232b;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    color:#777;
}

.selectedInfo strong{
    color:#ff4141;
}

/* ===== SEND BUTTON ===== */

.sendBtn{
    width:100%;
    margin-top:16px;
    padding:15px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#ff3838,#960b0b);
    color:#fff;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(255,30,30,.14);
    transition:.2s;
}

.sendBtn:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
}

/* ===== PROFILE ===== */

.avatarArea{
    text-align:center;
    margin-bottom:20px;
}

.bigAvatar{
    width:95px;
    height:95px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #ff3030;
    margin-bottom:12px;
}

.upload{
    display:inline-block;
    padding:10px 15px;
    background:#1b1e26;
    border:1px solid #2a2d36;
    border-radius:10px;
    font-size:11px;
    cursor:pointer;
}

.upload input{
    display:none;
}

.inputBox{
    margin-bottom:15px;
}

.inputBox label{
    display:block;
    color:#858a95;
    font-size:11px;
    margin-bottom:8px;
}

.inputBox input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #292c35;
    background:#090b0f;
    color:#fff;
    outline:none;
}

.saveBtn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#e62d2d;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.resetBtn{
    width:100%;
    margin-top:9px;
    padding:12px;
    border:1px solid #292c35;
    border-radius:11px;
    background:transparent;
    color:#777;
    cursor:pointer;
}

/* ===== FOOTER ===== */

footer{
    text-align:center;
    border-top:1px solid #181a20;
    padding:30px;
    color:#555;
    font-size:11px;
}

footer a{
    color:#ff3838;
    text-decoration:none;
}

/* ===== MOBILE ===== */

@media(max-width:600px){

    .header{
        padding:0 14px;
    }

    .logo{
        font-size:14px;
    }

    .logoIcon{
        width:38px;
        height:38px;
    }

    .hero{
        padding:55px 15px 35px;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:11px;
    }

    .imageBox{
        height:145px;
        padding:9px;
    }

    .info{
        padding:12px;
    }

    .info h3{
        font-size:11px;
        line-height:1.7;
    }

    .info p{
        font-size:9px;
    }

    .buyBtn{
        font-size:10px;
        padding:10px 4px;
    }

    .modalBox{
        padding:17px;
        border-radius:20px;
    }

    .wearGrid{
        grid-template-columns:1fr 1fr;
    }

    .wearCard{
        min-height:82px;
        padding:13px 10px;
    }

    .wearName{
        font-size:10px;
    }

    .wearCode{
        font-size:9px;
    }
}

</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <div class="logoIcon">🔫</div>
        <div>CS2 <span>SKIN SHOP</span></div>
    </div>

    <button class="profileBtn" onclick="openProfile()">
        <img id="headerAvatar">
        <span id="headerName">پروفایل</span>
    </button>

</header>


<section class="hero">

    <h1>
        فروشگاه <span>اسکین CS2</span>
    </h1>

    <p>
        اسکین موردنظر خود را انتخاب کنید
        <br>
        مدل گان را انتخاب کنید و درخواست خرید بفرستید.
    </p>

    <a
        class="telegram"
        href="https://t.me/aghojavaad"
        target="_blank"
    >
        💬 ارتباط در تلگرام
    </a>

</section>


<div class="searchArea">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 جستجوی اسکین..."
        oninput="searchProducts()"
    >

</div>


<main class="shop">

    <div
        id="products"
        class="grid"
    ></div>

</main>


<footer>

    برای خرید به آیدی زیر پیام دهید:

    <a
        href="https://t.me/aghojavaad"
        target="_blank"
    >
        @aghojavaad
    </a>

</footer>


<!-- ================= PROFILE ================= -->

<div
    id="profileModal"
    class="modal"
>

    <div class="modalBox">

        <div class="modalTop">

            <h2>👤 پروفایل</h2>

            <button
                class="closeBtn"
                onclick="closeProfile()"
            >
                ×
            </button>

        </div>


        <div class="avatarArea">

            <img
                id="bigAvatar"
                class="bigAvatar"
            >

            <br>

            <label class="upload">

                📷 انتخاب عکس پروفایل

                <input
                    type="file"
                    accept="image/*"
                    onchange="changeAvatar(event)"
                >

            </label>

        </div>


        <div class="inputBox">

            <label>
                نام نمایشی
            </label>

            <input
                id="profileName"
                maxlength="25"
                placeholder="مثلاً Javad"
            >

        </div>


        <button
            class="saveBtn"
            onclick="saveProfile()"
        >
            ذخیره پروفایل
        </button>


        <button
            class="resetBtn"
            onclick="resetProfile()"
        >
            حذف پروفایل
        </button>

    </div>

</div>


<!-- ================= BUY ================= -->

<div
    id="buyModal"
    class="modal"
>

    <div class="modalBox">

        <div class="modalTop">

            <h2>🛒 انتخاب اسکین</h2>

            <button
                class="closeBtn"
                onclick="closeBuy()"
            >
                ×
            </button>

        </div>


        <div class="preview">

            <img id="buyImage">

            <div>

                <strong id="buyName"></strong>

                <small>
                    انتخاب مدل برای خرید
                </small>

            </div>

        </div>


        <div class="selectorTitle">

            <b>✦</b>

            مدل اسکین را انتخاب کنید

        </div>


        <div class="wearGrid">


            <button
                type="button"
                class="wearCard active"
                data-wear="Factory New"
                onclick="chooseWear(this)"
            >

                <span class="wearCheck">✓</span>

                <span class="wearName">
                    Factory New
                </span>

                <span class="wearCode">
                    ۰ تا ۰.۰۷ • نو
                </span>

            </button>


            <button
                type="button"
                class="wearCard"
                data-wear="Minimal Wear"
                onclick="chooseWear(this)"
            >

                <span class="wearCheck">✓</span>

                <span class="wearName">
                    Minimal Wear
                </span>

                <span class="wearCode">
                    ۰.۰۷ تا ۰.۱۵ • کم‌خط
                </span>

            </button>


            <button
                type="button"
                class="wearCard"
                data-wear="Field-Tested"
                onclick="chooseWear(this)"
            >

                <span class="wearCheck">✓</span>

                <span class="wearName">
                    Field-Tested
                </span>

                <span class="wearCode">
                    ۰.۱۵ تا ۰.۳۸ • تست‌شده
                </span>

            </button>


            <button
                type="button"
                class="wearCard"
                data-wear="Well-Worn"
                onclick="chooseWear(this)"
            >

                <span class="wearCheck">✓</span>

                <span class="wearName">
                    Well-Worn
                </span>

                <span class="wearCode">
                    ۰.۳۸ تا ۰.۴۵ • کارکرده
                </span>

            </button>


            <button
                type="button"
                class="wearCard"
                data-wear="Battle-Scarred"
                onclick="chooseWear(this)"
            >

                <span class="wearCheck">✓</span>

                <span class="wearName">
                    Battle-Scarred
                </span>

                <span class="wearCode">
                    ۰.۴۵ تا ۱.۰۰ • فرسوده
                </span>

            </button>


        </div>


        <div class="selectedInfo">

            <span>
                مدل انتخاب‌شده
            </span>

            <strong id="selectedWear">
                Factory New
            </strong>

        </div>


        <button
            class="sendBtn"
            onclick="sendTelegram()"
        >
            📩 ارسال درخواست خرید در تلگرام
        </button>

    </div>

</div>

let selectedWear = "Factory New";

let temporaryAvatar = defaultAvatar;


/* =========================

========================= */

function renderProducts(list){

    const grid =
        document.getElementById("products");

    grid.innerHTML = "";

    list.forEach(product => {

        const realIndex =
            products.indexOf(product);

        const card =

        card.className = "card";

        card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"

            <div class="info">

                <h3>
                    ${product.name}
                </h3>

                <p>
                    برای خرید به آیدی زیر پیام دهید:
                    <br>
                    <strong>@aghojavaad</strong>
                </p>

                <button
                    class="buyBtn"
