<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSGO Shop Skins</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: linear-gradient(90deg, #080808, #220000, #080808);
      padding: 25px 15px;
      text-align: center;
      border-bottom: 2px solid #e00000;
    }

    header h1 {
      color: #ff2020;
      font-size: 32px;
      text-shadow: 0 0 15px #ff0000;
    }

    header p {
      color: #aaa;
      margin-top: 8px;
    }

    .banner {
      margin: 25px auto;
      max-width: 1100px;
      padding: 45px 20px;
      text-align: center;
      border: 1px solid #500000;
      border-radius: 15px;
      background: linear-gradient(135deg, #180000, #080808);
    }

    .banner h2 {
      font-size: 35px;
      color: white;
    }

    .banner span {
      color: #ff2020;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 15px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #ff2020;
      box-shadow: 0 0 20px #500000;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      background: #080808;
      border-radius: 10px;
    }

    .card h3 {
      margin-top: 15px;
      font-size: 18px;
    }

    .condition {
      color: #999;
      margin: 8px 0;
    }

    .price {
      color: #ff3030;
      font-size: 23px;
      font-weight: bold;
    }

    .buy {
      display: block;
      margin-top: 12px;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #d90000;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy:hover {
      background: #ff2020;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 30px;
      border-top: 1px solid #222;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>CSGO SHOP SKINS</h1>
  <p>Premium CS2 Skins</p>
</header>

<section class="banner">
  <h2>WELCOME TO <span>CS2 SHOP</span></h2>
  <p>Best skins • Best prices • Fast delivery</p>
</section>

<section class="products">

  <div class="card">
    <img src="https://via.placeholder.com/500x300?text=M4A1" alt="M4A1">
    <h3>M4A1 | Boreal Forest</h3>
    <p class="condition">Minimal Wear</p>
    <p class="price">110T</p>
    <button class="buy">BUY NOW</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/500x300?text=USP-S" alt="USP-S">
    <h3>StatTrak™ USP-S</h3>
    <p class="condition">Field-Tested</p>
    <p class="price">135T</p>
    <button class="buy">BUY NOW</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/500x300?text=R8" alt="R8">
    <h3>R8 Revolver | Junk Yard</h3>
    <p class="condition">Field-Tested</p>
    <p class="price">60T</p>
    <button class="buy">BUY NOW</button>
  </div>

</section>

<footer>
  © 2026 CS2 Shop Skins
</footer>

</body>
</html>
