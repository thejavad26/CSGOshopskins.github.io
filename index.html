<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CS2 SKIN SHOP</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(255,0,55,.18),transparent 35%),
    #070707;
  color:#fff;
  min-height:100vh;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  background:rgba(8,8,8,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,0,55,.2);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:21px;
  font-weight:900;
}

.logo-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff003c,#700018);
  box-shadow:0 0 25px rgba(255,0,55,.3);
}

.logo-icon svg{
  width:29px;
  height:29px;
}

/* PROFILE BUTTON */

.profile-btn{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:50%;
  overflow:hidden;
  background:#191919;
  border:2px solid #ff1748;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  box-shadow:0 0 15px rgba(255,0,55,.15);
}

.profile-btn img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

/* HERO */

.hero{
  text-align:center;
  padding:75px 20px 45px;
}

.badge{
  display:inline-block;
  padding:8px 15px;
  border:1px solid rgba(255,0,55,.35);
  background:rgba(255,0,55,.08);
  border-radius:30px;
  color:#ff4168;
  font-size:13px;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(35px,7vw,70px);
  font-weight:1000;
  line-height:1.1;
  background:linear-gradient(90deg,#fff,#ff1748);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#999;
  margin:18px auto 25px;
  max-width:600px;
  line-height:2;
}

.telegram-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:14px 23px;
  border-radius:13px;
  color:white;
  text-decoration:none;
  font-weight:bold;
  background:linear-gradient(135deg,#ff003c,#97001f);
  box-shadow:0 10px 30px rgba(255,0,55,.2);
  transition:.2s;
}

.telegram-btn:hover{
  transform:translateY(-3px);
}

/* PRODUCTS */

.container{
  width:min(1200px,92%);
  margin:auto;
}

.search-box{
  margin:10px 0 30px;
}

.search-box input{
  width:100%;
  padding:17px 20px;
  border-radius:15px;
  border:1px solid #292929;
  outline:none;
  background:#111;
  color:#fff;
  font-size:15px;
  transition:.2s;
}

.search-box input:focus{
  border-color:#ff1748;
  box-shadow:0 0 20px rgba(255,0,55,.1);
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  padding-bottom:70px;
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#141414,#0c0c0c);
  border:1px solid #252525;
  border-radius:20px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#ff1748;
  box-shadow:0 15px 40px rgba(255,0,55,.12);
}

.card-img{
  height:180px;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#222,transparent 65%),
    #101010;
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card-info{
  padding:17px;
}

.card-info h3{
  font-size:15px;
  margin-bottom:8px;
}

.condition{
  color:#8f8f8f;
  font-size:12px;
  margin-bottom:14px;
}

.price{
  color:#ff3158;
  font-size:20px;
  font-weight:900;
}

.buy-btn{
  width:100%;
  margin-top:14px;
  padding:12px;
  border-radius:11px;
  color:#fff;
  font-weight:bold;
  background:#1c1c1c;
  border:1px solid #303030;
  transition:.2s;
}

.buy-btn:hover{
  background:#ff003c;
  border-color:#ff003c;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
}

.modal.active{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111;
  border:1px solid #292929;
  border-radius:24px;
  padding:25px;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:scale(.94) translateY(10px);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.modal-head h2{
  font-size:20px;
}

.close{
  width:35px;
  height:35px;
  border-radius:10px;
  background:#1d1d1d;
  color:#aaa;
  font-size:20px;
}

.close:hover{
  background:#ff003c;
  color:white;
}

.modal-product{
  padding:15px;
  border-radius:17px;
  background:#181818;
  border:1px solid #282828;
  margin-bottom:20px;
}

.modal-product h3{
  margin-bottom:7px;
}

.modal-product p{
  color:#ff3158;
  font-weight:bold;
}

.section-title{
  color:#aaa;
  font-size:13px;
  margin-bottom:10px;
}

.wears{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:20px;
}

.wear{
  padding:13px 10px;
  border-radius:12px;
  background:#191919;
  color:#aaa;
  border:1px solid #292929;
  transition:.2s;
}

.wear:hover,
.wear.selected{
  background:rgba(255,0,55,.12);
  border-color:#ff1748;
  color:white;
}

.confirm-buy{
  width:100%;
  padding:15px;
  border-radius:13px;
  color:white;
  font-size:15px;
  font-weight:900;
  background:linear-gradient(135deg,#ff003c,#98001e);
}

/* PROFILE */

.avatar-area{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:22px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff1748;
  background:#1b1b1b;
  margin-bottom:12px;
}

.upload-btn{
  padding:8px 14px;
  border-radius:9px;
  background:#202020;
  color:#ddd;
  font-size:12px;
  cursor:pointer;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:7px;
}

.field input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #292929;
  background:#181818;
  color:#fff;
  outline:none;
  transition:.25s;
}

.field input:focus{
  border-color:#ff1748;
}

/* PHONE ERROR */

.phone-error{
  display:none;
  color:#ff3158;
  font-size:12px;
  margin-top:7px;
  animation:errorIn .25s ease;
}

.phone-error.show{
  display:block;
}

.phone-invalid{
  border-color:#ff1748 !important;
  box-shadow:0 0 0 2px rgba(255,23,72,.1);
  animation:shake .4s ease;
}

@keyframes shake{
  0%{transform:translateX(0)}
  20%{transform:translateX(7px)}
  40%{transform:translateX(-7px)}
  60%{transform:translateX(5px)}
  80%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

@keyframes errorIn{
  from{
    opacity:0;
    transform:translateY(-5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.save-profile{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#ff003c;
  color:#fff;
  font-weight:bold;
}

.delete-profile{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  background:#191919;
  color:#ff526f;
  border:1px solid #2d2d2d;
}

.delete-profile:hover{
  background:#2a1116;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#171717;
  border:1px solid #333;
  color:white;
  padding:13px 18px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media(max-width:600px){

  .header{
    padding:0 18px;
  }

  .hero{
    padding-top:50px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card-img{
    height:125px;
  }

  .card-info{
    padding:12px;
  }

  .card-info h3{
    font-size:12px;
  }

  .price{
    font-size:16px;
  }

  .buy-btn{
    font-size:12px;
    padding:10px;
  }

  .wears{
    grid-template-columns:1fr;
  }
}

@media(max-width:380px){

  .products{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header class="header">

  <div class="logo">

    <div class="logo-icon">
      <svg viewBox="0 0 64 64" fill="none">
        <path
          d="M12 18L27 31L12 46L18 51L32 37L46 51L52 46L37 31L52 18L46 13L32 25L18 13L12 18Z"
          fill="white"/>
        <path
          d="M27 31H37"
          stroke="#ff1748"
          stroke-width="4"
          stroke-linecap="round"/>
      </svg>
    </div>

    <span>CS2 SKIN SHOP</span>

  </div>

  <!-- PROFILE -->
  <button class="profile-btn" onclick="openProfile()">

      id="headerAvatar"
      alt="Profile"
      onerror="this.src=defaultAvatar;"
    >
  </button>

</header>


<section class="hero">

  <span class="badge">
    🔥 PREMIUM CS2 SKINS
  </span>

  <h1>
    CS2 SKIN SHOP
  </h1>

  <p>
    بهترین اسکین‌های Counter-Strike 2 با قیمت مناسب.
    اسکین موردنظرت رو انتخاب کن و برای خرید مستقیم پیام بده.
  </p>

  <a
    class="telegram-btn"
    href="https://t.me/aghojavaad"
    target="_blank">
    💬 تلگرام من
  </a>

</section>


<main class="container">

  <div class="search-box">

    <input
      id="search"
      type="text"
      placeholder="🔎 جستجوی اسکین..."
      oninput="searchProducts()"
    >

  </div>

  <div
    class="products"
    id="products">
  </div>

</main>


<!-- BUY MODAL -->

<div class="modal" id="buyModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>🛒 خرید اسکین</h2>

      <button
        class="close"
        onclick="closeModal('buyModal')">
        ×
      </button>

    </div>

    <div class="modal-product">

      <h3 id="modalName"></h3>

      <p id="modalPrice"></p>

    </div>

    <div class="section-title">
      مدل / Wear را انتخاب کنید
    </div>

    <div class="wears">

      <button
        class="wear"
        onclick="selectWear(this,'Factory New')">
        Factory New
      </button>

      <button
        class="wear"
        onclick="selectWear(this,'Minimal Wear')">
        Minimal Wear
      </button>

      <button
        class="wear"
        onclick="selectWear(this,'Field-Tested')">
        Field-Tested
      </button>

      <button
        class="wear"
        onclick="selectWear(this,'Well-Worn')">
        Well-Worn
      </button>

      <button
        class="wear"
        onclick="selectWear(this,'Battle-Scarred')">
        Battle-Scarred
      </button>

    </div>

    <button
      class="confirm-buy"
      onclick="buyProduct()">
      ادامه خرید در تلگرام
    </button>

  </div>

</div>


<!-- PROFILE MODAL -->

<div class="modal" id="profileModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>👤 پروفایل</h2>

      <button
        class="close"
        onclick="closeModal('profileModal')">
        ×
      </button>

    </div>


    <div class="avatar-area">

      <img
        id="profileAvatar"
        class="avatar"
        alt="Avatar"
        onerror="this.src=defaultAvatar;"
      >

      <label class="upload-btn">

        تغییر عکس

        <input
          type="file"
          id="avatarInput"
          accept="image/*"
          hidden
          onchange="changeAvatar(event)"
        >

      </label>

    </div>


    <div class="field">

      <label>
        نام نمایشی
      </label>

      <input
        id="profileName"
        type="text"
        placeholder="مثلاً Javad"
      >

    </div>


    <div class="field">

      <label>
        شماره موبایل
      </label>

      <input
        id="profilePhone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        placeholder="مثلاً 09123456789"
        oninput="clearPhoneError()"
      >

      <div
        class="phone-error"
        id="phoneError">
        ❌ شماره موبایل اشتباه است
      </div>

    </div>


    <button
      class="save-profile"
      onclick="saveProfile()">
      ذخیره اطلاعات
    </button>


    <button
      class="delete-profile"
      onclick="deleteProfile()">
      حذف اطلاعات پروفایل
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* =========================
   TELEGRAM
========================= */

const TELEGRAM_USERNAME = "aghojavaad";


/* =========================
   DEFAULT AVATAR
========================= */

const defaultAvatar =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

  <defs>

    <linearGradient
      id="g"
      x1="0"
      y1="0"
      x2="1"
      y2="1">

      <stop
        offset="0%"
        stop-color="#ff003c"/>

      <stop
        offset="100%"
        stop-color="#68001a"/>

    </linearGradient>

  </defs>

  <rect
    width="200"
    height="200"
    rx="100"
    fill="#151515"/>

  <circle
    cx="100"
    cy="75"
    r="38"
    fill="url(#g)"/>

  <path
    d="M38 180c7-43 36-65 62-65s55 22 62 65"
    fill="url(#g)"/>

</svg>
`);


/* =========================
   PRODUCTS
========================= */

const products = [

{
  name:"M4A1 | Naval Shred",
  price:"120T",
  condition:"Factory New",
  image:"https://images.unsplash.com/photo-1560253023-3ec5d502959f?auto=format&fit=crop&w=900&q=80"
},

{
  name:"StatTrak™ USP-S",
  price:"135T",
  condition:"Field-Tested",
  image:"https://images.unsplash.com/photo-1595590424283-b8f17842773f?auto=format&fit=crop&w=900&q=80"
},

{
  name:"M4A1 | Boreal Forest",
  price:"110T",
  condition:"Minimal Wear",
  image:"https://images.unsplash.com/photo-1595590424283-b8f17842773f?auto=format&fit=crop&w=900&q=80"
},

{
  name:"R8 Revolver | Junk Yard",
  price:"60T",
  condition:"Field-Tested",
  image:"https://images.unsplash.com/photo-1588094348336-5b8a4f8f1d6e?auto=format&fit=crop&w=900&q=80"
},

{
  name:"AK-47 | Redline",
  price:"250T",
  condition:"Field-Tested",
  image:"https://images.unsplash.com/photo-1595590424283-b8f17842773f?auto=format&fit=crop&w=900&q=80"
},

{
  name:"AWP | Asiimov",
  price:"420T",
  condition:"Field-Tested",
  image:"https://images.unsplash.com/photo-1560253023-3ec5d502959f?auto=format&fit=crop&w=900&q=80"
},

{
  name:"Glock-18 | Water Elemental",
  price:"95T",
  condition:"Minimal Wear",
  image:"https://images.unsplash.com/photo-1588094348336-5b8a4f8f1d6e?auto=format&fit=crop&w=900&q=80"
},

{
  name:"Desert Eagle | Printstream",
  price:"310T",
  condition:"Factory New",
  image:"https://images.unsplash.com/photo-1595590424283-b8f17842773f?auto=format&fit=crop&w=900&q=80"
},

{
  name:"Karambit | Doppler",
  price:"900T",
  condition:"Factory New",
  image:"https://images.unsplash.com/photo-1560253023-3ec5d502959f?auto=format&fit=crop&w=900&q=80"
},

{
  name:"Butterfly Knife | Freehand",
  price:"650T",
  condition:"Field-Tested",
  image:"https://images.unsplash.com/photo-1588094348336-5b8a4f8f1d6e?auto=format&fit=crop&w=900&q=80"
}

];


let currentProducts = products;
let selectedProduct = null;
let selectedWear = "";


/* =========================
   PRODUCTS
========================= */

function renderProducts(list = products){

  const box =
    document.getElementById("products");

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        اسکینی با این اسم پیدا نشد 😔
      </div>
    `;

    return;
  }

  box.innerHTML = list.map((p,index)=>`

    <div class="card">

      <div class="card-img">

        <img
          src="${p.image}"
          alt="${p.name}"
          loading="lazy"
        >

      </div>

      <div class="card-info">

        <h3>${p.name}</h3>

        <div class="condition">
          ${p.condition}
        </div>

        <div class="price">
          ${p.price}
        </div>

        <button
          class="buy-btn"
          onclick="openBuy(${index})">
          🛒 خرید
        </button>

      </div>

    </div>

  `).join("");

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

  const value =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  currentProducts =
    products.filter(p =>
      p.name.toLowerCase().includes(value)
    );

  renderProducts(currentProducts);
}


/* =========================
   BUY
========================= */

function openBuy(index){

  selectedProduct =
    currentProducts[index];

  selectedWear = "";

  document.getElementById("modalName")
    .textContent =
    selectedProduct.name;

  document.getElementById("modalPrice")
    .textContent =
    selectedProduct.price;

  document.querySelectorAll(".wear")
    .forEach(x =>
      x.classList.remove("selected")
    );

  document.getElementById("buyModal")
    .classList.add("active");
}


function selectWear(button,wear){

  selectedWear = wear;

  document.querySelectorAll(".wear")
    .forEach(x =>
      x.classList.remove("selected")
    );

  button.classList.add("selected");
}


function buyProduct(){

  if(!selectedProduct){

    showToast("اسکین انتخاب نشده");

    return;
  }

  if(!selectedWear){

    showToast("اول مدل اسکین را انتخاب کن");

    return;
  }

  const message =
`سلام 👋

من می‌خوام این اسکین رو خریداری کنم:

🎮 ${selectedProduct.name}
💰 قیمت: ${selectedProduct.price}
🔧 Wear: ${selectedWear}

لطفاً راهنمایی کنید.`;

  const url =
    `https://t.me/${TELEGRAM_USERNAME}?text=${encodeURIComponent(message)}`;

  window.open(url,"_blank");

  closeModal("buyModal");
}


/* =========================
   PROFILE
========================= */

function openProfile(){

  document.getElementById("profileName")
    .value =
    localStorage.getItem("cs2_profile_name") || "";

  document.getElementById("profilePhone")
    .value =
    localStorage.getItem("cs2_profile_phone") || "";

  const avatar =
    localStorage.getItem("cs2_profile_avatar") ||
    defaultAvatar;

  document.getElementById("profileAvatar")
    .src = avatar;

  document.getElementById("profileModal")
    .classList.add("active");
}


/* =========================
   PHONE VALIDATION
========================= */

function isValidIranPhone(phone){

  /*
    فرمت‌های قابل قبول:

    09123456789
    +989123456789
    00989123456789
  */

  const clean =
    phone.replace(/[\s-]/g,"");

  const iranPattern =
    /^(09\d{9}|\+989\d{9}|00989\d{9})$/;

  return iranPattern.test(clean);
}


function clearPhoneError(){

  const input =
    document.getElementById("profilePhone");

  const error =
    document.getElementById("phoneError");

  input.classList.remove("phone-invalid");

  error.classList.remove("show");
}


function showPhoneError(){

  const input =
    document.getElementById("profilePhone");

  const error =
    document.getElementById("phoneError");

  input.classList.remove("phone-invalid");

  /*
    برای اینکه انیمیشن هر بار
    دوباره اجرا شود
  */

  void input.offsetWidth;

  input.classList.add("phone-invalid");

  error.classList.add("show");

  input.focus();
}


/* =========================
   SAVE PROFILE
========================= */

function saveProfile(){

  const name =
    document
      .getElementById("profileName")
      .value
      .trim();

  const phoneInput =
    document.getElementById("profilePhone");

  const phone =
    phoneInput.value.trim();


  /*
    اگر شماره وارد شده باشد،
    باید معتبر باشد.
  */

  if(phone && !isValidIranPhone(phone)){

    showPhoneError();

    return;
  }


  localStorage.setItem(
    "cs2_profile_name",
    name
  );

  localStorage.setItem(
    "cs2_profile_phone",
    phone
  );


  updateHeaderAvatar();

  showToast("پروفایل ذخیره شد ✅");


  setTimeout(()=>{
    closeModal("profileModal");
  },700);
}


/* =========================
   CHANGE AVATAR
========================= */

function changeAvatar(event){

  const file =
    event.target.files[0];

  if(!file) return;


  if(!file.type.startsWith("image/")){

    showToast("فایل انتخاب‌شده عکس نیست");

    return;
  }


  if(file.size > 5 * 1024 * 1024){

    showToast("حجم عکس باید کمتر از 5MB باشد");

    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(){

    const image =
      reader.result;

    localStorage.setItem(
      "cs2_profile_avatar",
      image
    );


    document.getElementById("profileAvatar")
      .src = image;


    /*
      بلافاصله عکس بالا هم آپدیت می‌شود
    */

    document.getElementById("headerAvatar")
      .src = image;


    showToast("عکس پروفایل تغییر کرد ✅");
  };


  reader.readAsDataURL(file);
}


/* =========================
   HEADER AVATAR
========================= */

function updateHeaderAvatar(){

  const header =
    document.getElementById("headerAvatar");

  const avatar =
    localStorage.getItem("cs2_profile_avatar");


  if(avatar){

    header.src = avatar;

  }else{

    header.src = defaultAvatar;

  }


  /*
    اگر عکس خراب یا پاک شده بود
    دوباره آواتار پیش‌فرض را بگذار
  */

  header.onerror = function(){

    this.onerror = null;

    this.src = defaultAvatar;

  };
}


/* =========================
   DELETE PROFILE
========================= */

function deleteProfile(){

  const confirmDelete =
    confirm(
      "مطمئنی می‌خوای اطلاعات پروفایلت حذف بشه؟"
    );

  if(!confirmDelete) return;


  localStorage.removeItem(
    "cs2_profile_name"
  );

  localStorage.removeItem(
    "cs2_profile_phone"
  );

  localStorage.removeItem(
    "cs2_profile_avatar"
  );


  document.getElementById("profileName")
    .value = "";

  document.getElementById("profilePhone")
    .value = "";

  document.getElementById("profileAvatar")
    .src = defaultAvatar;


  updateHeaderAvatar();


  showToast(
    "اطلاعات پروفایل حذف شد"
  );
}


/* =========================
   MODALS
========================= */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("active");
}


document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      function(e){

        if(e.target === modal){

          modal.classList.remove("active");

        }

      }
    );

  });


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2500);
}


/* =========================
   START
========================= */

updateHeaderAvatar();

renderProducts();

</script>
